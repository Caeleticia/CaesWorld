<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <base href="./" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#E5FFFF" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="Cae'sWorld —— 每个人都能做卡牌。" />
  <title>Cae'sWorld</title>
  <!-- data/tips.txt、assets/banner/index.txt 在 file:// 下会被浏览器按 CORS 拦住，此时走内置兜底 -->
  <meta name="cw-tips-source" content="fallback" />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/loading.css" />
  <link rel="stylesheet" href="css/menu.css" />
  <link rel="stylesheet" href="css/editor.css" />
</head>
<body class="is-loading">

  <!-- ======================= 载入页面 ======================= -->
  <section id="loading-screen" class="loading-screen" aria-labelledby="loading-title">
    <div class="loading-note">
      <div class="pushpin" aria-hidden="true"></div>

      <header class="cw-head">
        <h1 class="cw-title" id="loading-title"><span class="cw-title-a">Cae's</span><span class="cw-title-b">World</span></h1>
        <p class="cw-slogan">每个人都能做卡牌</p>
      </header>

      <div class="cw-tip" aria-label="你知道吗">
        <span class="cw-tip-label"><span class="cw-tip-star" aria-hidden="true">✦</span>你知道吗</span>
        <p class="cw-tip-text" id="loading-tip" aria-live="polite">正在翻开小纸条…</p>
      </div>

      <div class="loading-progress" role="group" aria-label="加载进度">
        <div class="bar-track">
          <div class="bar-fill" id="loading-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>
        <div class="bar-meta">
          <span class="bar-status" id="loading-status">正在加载数据</span>
          <span class="bar-pct" id="loading-pct">0%</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ======================= 主菜单 ======================= -->
  <main id="main-menu" class="main-menu" hidden>
    <!-- 左侧边栏：品牌 + 你知道吗 + 标签（每个标签带弹出选项） -->
    <aside class="sidebar" aria-label="主菜单导航">
      <div class="sidebar-brand">
        <h1 class="cw-title cw-title--small"><span class="cw-title-a">Cae's</span><span class="cw-title-b">World</span></h1>
        <p class="cw-slogan">by caeleticia</p>
      </div>

      <div class="cw-tip cw-tip--side" aria-label="你知道吗">
        <span class="cw-tip-label">
          <span class="cw-tip-star" aria-hidden="true">✦</span>你知道吗
          <button class="cw-tip-refresh" type="button" aria-label="换一条你知道吗" title="换一条">↻</button>
        </span>
        <p class="cw-tip-text" id="menu-tip" aria-live="polite"></p>
      </div>

      <nav class="tab-nav" id="tab-nav" aria-label="功能">
        <!-- 由 js/menus.js 渲染 -->
      </nav>
    </aside>

    <!-- 右侧：每次进入从 assets/banner/index.txt 随机载入一张头图 -->
    <section class="stage" id="stage" aria-label="头图">
      <div class="stage-picture">
        <img id="stage-picture" class="stage-picture-img" alt="" hidden draggable="false" />
      </div>
    </section>
  </main>

  <!-- ======================= 编辑器 ======================= -->
  <main id="editor-page" class="editor-page" hidden>
    <header class="editor-topbar">
      <a class="btn small" id="btn-back" href="#menu">← 返回</a>
      <div class="editor-title">编辑器 <span id="ed-status" class="ed-status"></span></div>
      <div class="editor-actions">
        <button class="btn small" id="btn-save" type="button">保存</button>
        <button class="btn small" id="btn-export" type="button">导出工程</button>
        <button class="btn small" id="btn-export-content" type="button">导出内容包</button>
        <button class="btn small" id="btn-import" type="button">导入</button>
        <input type="file" id="import-file" accept="application/json" hidden />
        <input type="file" id="import-content-file" accept="application/json" hidden />
      </div>
    </header>

    <nav class="ed-tabs" role="tablist">
      <button class="ed-tab is-active" data-tab="character" type="button">设计角色</button>
      <button class="ed-tab" data-tab="skills" type="button">设计技能</button>
      <button class="ed-tab" data-tab="effects" type="button">设计效果</button>
    </nav>

    <!-- 角色 -->
    <section class="ed-panel" data-panel="character">
      <div class="ed-columns">
        <div class="ed-col ed-col-form">
          <h2>角色数据</h2>
          <div class="form-grid">
            <label class="form-field"><span>名字</span><input id="f-name" /></label>
            <label class="form-field"><span>id</span><input id="f-id" placeholder="custom_unit_xxx" /><em>扩展包_类型_标识</em></label>
            <label class="form-field"><span>品质</span>
              <select id="f-quality">
                <option value="white">白</option><option value="blue">蓝</option><option value="gold">金</option><option value="rainbow">彩</option>
              </select>
            </label>
            <label class="form-field"><span>等级</span><input id="f-level" type="number" /></label>
            <label class="form-field"><span>基础生命值</span><input id="f-hp" type="number" /></label>
            <label class="form-field"><span>基础攻击力</span><input id="f-atk" type="number" /></label>
            <label class="form-field"><span>基础防御力</span><input id="f-def" type="number" /></label>
            <label class="form-field"><span>暴击率</span><input id="f-crit" type="number" step="0.01" /></label>
            <label class="form-field"><span>暴击伤害</span><input id="f-critdmg" type="number" step="0.1" /></label>
            <label class="form-field"><span>速度</span><input id="f-speed" type="number" /></label>
            <label class="form-field"><span>标签</span><input id="f-label" placeholder="可选，一个单位一个标签" /></label>
            <label class="form-field"><span>卡面图片路径</span><input id="f-image" placeholder="assets/banner/xxx.png 或留空用占位卡面" /></label>
          </div>
          <div class="form-row">
            <label class="form-check"><input id="f-occupy" type="checkbox" /> 占位</label>
            <label class="form-check"><input id="f-count" type="checkbox" /> 计数</label>
            <label class="form-check"><input id="f-invincible" type="checkbox" /> 无敌</label>
          </div>
          <fieldset class="resist-box">
            <legend>各系抗性（本源为真实伤害，无抗性）</legend>
            <label>物理 <input id="f-res-physical" type="number" step="0.01" /></label>
            <label>魔法 <input id="f-res-magic" type="number" step="0.01" /></label>
            <label>精神 <input id="f-res-spirit" type="number" step="0.01" /></label>
          </fieldset>
          <div class="form-row">
            <label class="btn small">选择图片<input id="f-image-file" type="file" accept="image/*" hidden /></label>
            <button class="btn small" id="btn-placeholder" type="button">用占位图</button>
          </div>
        </div>

        <div class="ed-col ed-col-preview">
          <h2>卡面预览</h2>
          <p class="muted">把 data/pack/&lt;卡组&gt;/ 下的 单位.json / 技能.json / 效果.json 或单张卡的 JSON 拖到这里即可导入继续改。</p>
          <div class="card-preview" id="ed-card-preview"></div>
          <p class="muted" id="ed-unit-stats"></p>
          <h2>挂载技能</h2>
          <div class="mount-list" id="ed-mount-skills"></div>
          <h2>挂载效果</h2>
          <div class="mount-list" id="ed-mount-effects"></div>
        </div>
      </div>
    </section>

    <!-- 技能 / 效果 共用的「数据 + 流程」布局 -->
    <section class="ed-panel" data-panel="skills">
      <div class="ed-columns ed-columns-skill">
        <div class="ed-col ed-col-form">
          <div id="ed-skill-col">
            <div class="list-head">
              <select id="ed-skill-list" class="grow"></select>
              <button class="btn small" id="btn-new-skill" type="button" data-action="new-skill">新建技能</button>
            </div>
            <div id="ed-skill-form" class="form-form"></div>
          </div>
          <div id="ed-effect-col" hidden>
            <div class="list-head">
              <select id="ed-effect-list" class="grow"></select>
              <button class="btn small" id="btn-new-effect" type="button" data-action="new-effect">新建效果</button>
            </div>
            <div id="ed-effect-form" class="form-form"></div>
          </div>
        </div>
        <div class="ed-col ed-col-flow">
          <div class="flow-head">
            <strong id="flow-title">流程</strong>
            <div class="flow-tools">
              <button class="btn tiny" id="btn-zoom-out" type="button">－</button>
              <span id="zoom-label">100%</span>
              <button class="btn tiny" id="btn-zoom-in" type="button">＋</button>
              <button class="btn tiny" id="btn-fit" type="button">适应</button>
              <button class="btn tiny danger" id="btn-delete-block" type="button" disabled>删除积木</button>
              <button class="btn tiny danger" id="btn-clear-flow" type="button">清空</button>
            </div>
          </div>
          <div class="flow-layout">
            <aside class="palette" id="ed-palette"></aside>
            <div class="canvas-wrap">
              <div class="blocks-canvas" id="blocks-canvas">
                <div class="blocks-world" id="blocks-world"></div>
                <div class="cut-marker" id="cut-marker"></div>
                <div class="flow-empty" id="flow-empty"></div>
              </div>
            </div>
          </div>
          <div class="flow-errors" id="flow-errors" hidden></div>
          <div class="json-panel">
            <div class="json-head"><strong>执行流程 JSON（实时）</strong><button class="btn tiny" id="btn-copy-flow" type="button">复制</button></div>
            <pre id="json-flow">{}</pre>
          </div>
        </div>
      </div>
    </section>

    <!-- 实时存档 JSON：桌面端贴在编辑区底部，移动端固定屏幕下方，可折叠成悬浮球 -->
    <section class="json-save-panel" id="json-save-panel" aria-label="存档 JSON">
      <div class="json-head">
        <strong>存档 JSON（积木 / 填写 / 连接 / 位置）</strong>
        <span class="json-head-actions">
          <button class="btn tiny" id="btn-copy-save" type="button">复制内容包</button>
          <button class="btn tiny json-collapse-btn" id="btn-collapse-save" type="button"
                  aria-controls="json-save" aria-expanded="true" title="折叠成悬浮球">—</button>
        </span>
      </div>
      <pre id="json-save" class="json-save-body"></pre>
    </section>
    <!-- 折叠后的小悬浮球：收缩到屏幕边缘，显示 js -->
    <button class="json-fab" id="json-fab" type="button" hidden aria-controls="json-save-panel" aria-expanded="false"
            aria-label="展开存档 JSON" title="展开存档 JSON">js</button>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
