<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <base href="./" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#E5FFFF" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="Cae'sWorld —— 每个人都能做卡牌。动态 UI，不含玩法。" />
  <title>Cae'sWorld · 每个人都能做卡牌</title>
  <!-- data/tips.txt 在 file:// 下会被浏览器按 CORS 拦住，此时走内置兜底字符库 -->
  <meta name="cw-tips-source" content="fallback" />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/loading.css" />
  <link rel="stylesheet" href="css/menu.css" />
</head>
<body class="is-loading">

  <!-- ======================= 载入页面 ======================= -->
  <section id="loading-screen" class="loading-screen" aria-labelledby="loading-title">
    <div class="loading-note">
      <div class="pushpin" aria-hidden="true"></div>

      <header class="cw-head">
        <h1 class="cw-title" id="loading-title"><span class="cw-title-a">Cae's</span><span class="cw-title-b">World</span></h1>
        <p class="cw-slogan">每个人都能做卡牌</p>
      </header>

      <div class="cw-tip" aria-label="你知道吗">
        <span class="cw-tip-label"><span class="cw-tip-star" aria-hidden="true">✦</span>你知道吗</span>
        <p class="cw-tip-text" id="loading-tip" aria-live="polite">正在翻开小纸条…</p>
      </div>

      <div class="loading-progress" role="group" aria-label="加载进度">
        <div class="bar-track">
          <div class="bar-fill" id="loading-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>
        <div class="bar-meta">
          <span class="bar-status" id="loading-status">正在加载数据</span>
          <span class="bar-pct" id="loading-pct">0%</span>
        </div>
      </div>
    </div>

    <footer class="loading-foot">
      <span class="loading-version">动态 UI · 不含玩法</span>
    </footer>
  </section>

  <!-- ======================= 主菜单 ======================= -->
  <main id="main-menu" class="main-menu" hidden>
    <!-- 左侧边栏：品牌 + 你知道吗 + 标签（每个标签带弹出选项） -->
    <aside class="sidebar" aria-label="主菜单导航">
      <div class="sidebar-brand">
        <h1 class="cw-title cw-title--small"><span class="cw-title-a">Cae's</span><span class="cw-title-b">World</span></h1>
        <p class="cw-slogan">每个人都能做卡牌</p>
      </div>

      <div class="cw-tip cw-tip--side" aria-label="你知道吗">
        <span class="cw-tip-label">
          <span class="cw-tip-star" aria-hidden="true">✦</span>你知道吗
          <button class="cw-tip-refresh" type="button" aria-label="换一条你知道吗" title="换一条">↻</button>
        </span>
        <p class="cw-tip-text" id="menu-tip" aria-live="polite"></p>
      </div>

      <nav class="tab-nav" id="tab-nav" aria-label="功能">
        <!-- 由 js/menus.js 渲染 -->
      </nav>

      <footer class="sidebar-foot">
        <span>动态 UI · 不含玩法</span>
      </footer>
    </aside>

    <!-- 右侧：空白区域 + 一张随机图片 -->
    <section class="stage" id="stage" aria-label="展示区">
      <div class="stage-picture">
        <img id="stage-picture" class="stage-picture-img" alt="" draggable="false" />
        <span class="stage-picture-tag" id="stage-picture-tag" hidden></span>
      </div>
      <div class="stage-toast" id="stage-toast" role="status" aria-live="polite" hidden></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
